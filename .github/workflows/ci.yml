name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig version
      - run: zig fmt --check build.zig build.zig.zon tests.zig native_tests.zig src tests bench examples
      - run: sh tools/setup-native.sh
      - run: zig build
      - run: zig build test-native --summary all
      - run: zig build test
      - run: zig build fuzz -Dfuzz-iterations=100000
      - run: zig build -Doptimize=ReleaseSafe test
      - run: zig build test-native -Doptimize=ReleaseSafe
      - run: zig build stress-smoke -Doptimize=ReleaseSafe
      - run: zig build bench

  windows-native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: powershell -ExecutionPolicy Bypass -File tools/setup-native.ps1
      - run: zig fmt --check build.zig build.zig.zon tests.zig native_tests.zig src tests bench examples
      - run: zig build
      - run: zig build test-native -Doptimize=ReleaseSafe
      - run: zig build stress-smoke -Doptimize=ReleaseSafe