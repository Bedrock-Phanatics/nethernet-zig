name: transport stress

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: sh tools/setup-native.sh
      - run: zig build test-integration -Doptimize=ReleaseSafe
      - run: zig build fuzz --fuzz=1M -Dfuzz-iterations=10000
      - run: >
          zig build stress -Doptimize=ReleaseSafe --
          --connections 100 --duration-ms 600000 --payload-size 8192
          --rate 20 --churn-messages 10000

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [asan, tsan]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: >
          sh tools/stress-diagnostics.sh ${{ matrix.mode }}
          --connections 2 --duration-ms 10000 --payload-size 8192
          --churn-messages 200
